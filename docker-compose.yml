services:
    nginx:
        image: nginx:stable-alpine
        container_name: pandypost-nginx
        ports:
            - "9000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - reverb
        networks:
            - pandypost-network

    php:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-php
        command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001 --workers=auto --max-requests=500
        ports:
            - "8001:8001"
        environment:
            - XDEBUG_MODE=debug
            - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003 idekey=docker
            - PHP_IDE_CONFIG=serverName=pandypost.local
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./docker/php/dev/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        depends_on:
            - redis
            - redis-cache
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    reverb:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-reverb
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - "8080:8080"
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - redis
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    horizon:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-horizon
        command: php artisan horizon
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - redis
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    redis:
        image: redis:alpine
        container_name: pandypost-redis
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - pandypost-network

    redis-cache:
        image: redis:alpine
        container_name: pandypost-redis-cache
        command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
        ports:
            - "127.0.0.1:6380:6379"
        networks:
            - pandypost-network

    pgsql:
        image: postgres:17-alpine
        container_name: pandypost-pgsql
        restart: unless-stopped
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_DB: pandypost
            POSTGRES_USER: pandypost
            POSTGRES_PASSWORD: pandypost
        volumes:
            - pgsql_data:/var/lib/postgresql/data
        networks:
            - pandypost-network

    # Inicializador do Bucket Dev (play.minio) com protecao para Producao
    bucket-init:
        image: amazon/aws-cli:latest
        container_name: pandypost-bucket-init
        environment:
            - APP_ENV=${APP_ENV:-local}
            - AWS_ACCESS_KEY_ID=Q3AM3UQ867SPQQA43P2F
            - AWS_SECRET_ACCESS_KEY=zuf+tfteSlswRu7BJ86wekitnifILbZam1KYY3TG
            - AWS_DEFAULT_REGION=us-east-1
        entrypoint: >
            /bin/sh -c "
            if [ "\$$APP_ENV" = "production" ] || [ "\$$APP_ENV" = "prod" ]; then
                echo '[AVISO] Ambiente de PRODUCAO detectado. Ignorando criacao automatica de bucket dev.';
                exit 0;
             fi;
             echo 'Configurando bucket de dev no play.min.io...';
            aws --endpoint-url https://play.min.io s3api head-bucket --bucket pandypost-dev 2>/dev/null ||
            aws --endpoint-url https://play.min.io s3api create-bucket --bucket pandypost-dev;
            aws --endpoint-url https://play.min.io s3api put-bucket-policy --bucket pandypost-dev --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::pandypost-dev/*\"]}]}';
            echo '[SUCESSO] Bucket pandypost-dev pronto para uso!';
            exit 0;
            "
        networks:
            - pandypost-network

volumes:
    redis_data:
    pgsql_data:

networks:
    pandypost-network:
        driver: bridge
