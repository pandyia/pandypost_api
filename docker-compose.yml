services:
    nginx:
        image: nginx:stable-alpine
        container_name: pandypost-nginx
        ports:
            - "9000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - reverb
        networks:
            - pandypost-network

    php:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-php
        command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001 --workers=auto --max-requests=500
        ports:
            - "8001:8001"
        environment:
            - XDEBUG_MODE=debug
            - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003 idekey=docker
            - PHP_IDE_CONFIG=serverName=pandypost.local
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./docker/php/dev/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        depends_on:
            - redis
            - redis-cache
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    reverb:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-reverb
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - "8080:8080"
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - redis
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    horizon:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-horizon
        command: php artisan horizon
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - redis
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    redis:
        image: redis:alpine
        container_name: pandypost-redis
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - pandypost-network

    # Espelha a separação de produção (filas x cache) para que
    # REDIS_CACHE_HOST=redis-cache do .env.example funcione igual em dev.
    redis-cache:
        image: redis:alpine
        container_name: pandypost-redis-cache
        command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
        ports:
            - "127.0.0.1:6380:6379"
        networks:
            - pandypost-network

    pgsql:
        image: postgres:17-alpine
        container_name: pandypost-pgsql
        restart: unless-stopped
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_DB: pandypost
            POSTGRES_USER: pandypost
            POSTGRES_PASSWORD: pandypost
        volumes:
            - pgsql_data:/var/lib/postgresql/data
        networks:
            - pandypost-network

volumes:
    redis_data:
    pgsql_data:

networks:
    pandypost-network:
        driver: bridge
