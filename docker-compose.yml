services:
    nginx:
        image: nginx:stable-alpine
        container_name: pandypost-nginx
        ports:
            - "9000:80"
            # Proxy do MinIO: é por aqui que o browser consome as presigned URLs.
            - "127.0.0.1:9002:9002"
            - "[::1]:9002:9002"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/minio.conf:/etc/nginx/conf.d/minio.conf
        depends_on:
            - php
            - reverb
            - minio
        networks:
            - pandypost-network

    php:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-php
        command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001 --workers=auto --max-requests=500
        ports:
            - "8001:8001"
        environment:
            - XDEBUG_MODE=debug
            - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003 idekey=docker
            - PHP_IDE_CONFIG=serverName=pandypost.local
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./docker/php/dev/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        depends_on:
            - redis
            - redis-cache
            - pgsql
            - minio
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    reverb:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-reverb
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - "8080:8080"
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - redis
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    horizon:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-horizon
        command: php artisan horizon
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - redis
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    redis:
        image: redis:alpine
        container_name: pandypost-redis
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - pandypost-network

    # Espelha a separação de produção (filas x cache) para que
    # REDIS_CACHE_HOST=redis-cache do .env.example funcione igual em dev.
    redis-cache:
        image: redis:alpine
        container_name: pandypost-redis-cache
        command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
        ports:
            - "127.0.0.1:6380:6379"
        networks:
            - pandypost-network

    pgsql:
        image: postgres:17-alpine
        container_name: pandypost-pgsql
        restart: unless-stopped
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_DB: pandypost
            POSTGRES_USER: pandypost
            POSTGRES_PASSWORD: pandypost
        volumes:
            - pgsql_data:/var/lib/postgresql/data
        networks:
            - pandypost-network

    # MinIO — S3 local, no lugar do Backblaze B2 usado em produção.
    #
    # A API S3 não é publicada no host de propósito: o browser chega nela pelo
    # proxy do nginx em localhost:9002, que devolve o header Host assinado pelo
    # PHP. Publicar direto aqui daria SignatureDoesNotMatch nas presigned URLs.
    minio:
        image: minio/minio:latest
        container_name: pandypost-minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: pandypost
            MINIO_ROOT_PASSWORD: pandypost
            # O PUT direto do browser (FRONTEND_URL) precisa passar no preflight.
            MINIO_API_CORS_ALLOW_ORIGIN: "*"
        ports:
            # Console web: http://localhost:9001 (login pandypost / pandypost)
            - "127.0.0.1:9001:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - pandypost-network

    # Cria o bucket do AWS_BUCKET no primeiro up e encerra. Idempotente.
    minio-init:
        image: minio/mc:latest
        container_name: pandypost-minio-init
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 pandypost pandypost && mc mb --ignore-existing local/pandypost"]
        networks:
            - pandypost-network

volumes:
    redis_data:
    pgsql_data:
    minio_data:

networks:
    pandypost-network:
        driver: bridge
