services:
    nginx:
        image: nginx:stable-alpine
        container_name: pandypost-nginx
        ports:
            - "9000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - reverb
        networks:
            - pandypost-network

    php:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-php
        command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001 --workers=auto --max-requests=500
        ports:
            - "8001:8001"
        environment:
            - XDEBUG_MODE=debug
            - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003 idekey=docker
            - PHP_IDE_CONFIG=serverName=pandypost.local
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./docker/php/dev/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        depends_on:
            - redis
            - redis-cache
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    reverb:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-reverb
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - "8080:8080"
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - redis
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    horizon:
        build:
            context: ./docker/php/dev
            dockerfile: Dockerfile
        container_name: pandypost-horizon
        command: php artisan horizon
        volumes:
            - ./:/var/www/html
            - ./docker/php/dev/php.ini:/usr/local/etc/php/conf.d/custom.ini
        depends_on:
            - redis
            - pgsql
        networks:
            - pandypost-network
        extra_hosts:
            - "host.docker.internal:host-gateway"

    redis:
        image: redis:alpine
        container_name: pandypost-redis
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - pandypost-network

    redis-cache:
        image: redis:alpine
        container_name: pandypost-redis-cache
        command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
        ports:
            - "127.0.0.1:6380:6379"
        networks:
            - pandypost-network

    pgsql:
        image: postgres:17-alpine
        container_name: pandypost-pgsql
        restart: unless-stopped
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_DB: pandypost
            POSTGRES_USER: pandypost
            POSTGRES_PASSWORD: pandypost
        volumes:
            - pgsql_data:/var/lib/postgresql/data
        networks:
            - pandypost-network

    # Storage S3 local (MinIO) para dev. O alias minio.localtest.me + a mesma porta (9100)
    # dentro e fora do Docker fazem a URL pré-assinada valer para a API e para o navegador
    # (curl trata *.localhost como loopback, por isso não usamos esse domínio).
    minio:
        # As imagens oficiais minio/minio saíram do Docker Hub; bitnamilegacy/minio é o MinIO congelado (suficiente para dev).
        image: bitnamilegacy/minio:latest
        container_name: pandypost-minio
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: pandypost
            MINIO_ROOT_PASSWORD: pandypost-secret
            MINIO_API_PORT_NUMBER: "9100"
            MINIO_CONSOLE_PORT_NUMBER: "9101"
        ports:
            - "127.0.0.1:9100:9100"
            - "127.0.0.1:9101:9101"
        volumes:
            - minio_data:/bitnami/minio/data
        networks:
            pandypost-network:
                aliases:
                    - minio.localtest.me

    # Cria o bucket de dev no MinIO local, com proteção para Produção
    bucket-init:
        image: bitnamilegacy/minio:latest
        container_name: pandypost-bucket-init
        depends_on:
            - minio
        environment:
            - APP_ENV=${APP_ENV:-local}
        entrypoint: >
            /bin/sh -c "
            if [ \"\$$APP_ENV\" = \"production\" ] || [ \"\$$APP_ENV\" = \"prod\" ]; then
                echo '[AVISO] Ambiente de PRODUCAO detectado. Ignorando criacao automatica de bucket dev.';
                exit 0;
            fi;
            until mc alias set local http://minio.localtest.me:9100 pandypost pandypost-secret; do sleep 2; done;
            mc mb --ignore-existing local/pandypost-dev &&
            mc anonymous set download local/pandypost-dev &&
            echo '[SUCESSO] Bucket pandypost-dev pronto para uso!';
            exit 0;
            "
        networks:
            - pandypost-network

volumes:
    minio_data:
    redis_data:
    pgsql_data:

networks:
    pandypost-network:
        driver: bridge
