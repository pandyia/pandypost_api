name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem existente no GHCR (ex: v0.9.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/prod/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/pandypost-php:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/pandypost-php:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          # Contexto = raiz: o Dockerfile assa public/ na imagem do nginx.
          context: .
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/pandypost-nginx:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/pandypost-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Redis image
        uses: docker/build-push-action@v6
        with:
          context: docker/redis
          file: docker/redis/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/pandypost-redis:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/pandypost-redis:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || github.event_name == 'workflow_dispatch')
    environment: Production
    steps:
      - name: Set image tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          name: id_ed25519

      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_PATH: ${{ secrets.APP_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_HOSTNAMES: ${{ secrets.CF_HOSTNAMES }}
        run: |
          ssh -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} << DEPLOY_SCRIPT
            set -e
            cd ${APP_PATH}
            COMPOSE="docker compose -f docker-compose.prod.yml"

            # Faz checkout da MESMA tag que gerou as imagens. Antes o servidor
            # dava 'git pull origin main', então o docker-compose.prod.yml no
            # disco podia ser mais novo (ou mais velho) que as imagens do GHCR.
            echo "Checking out ${IMAGE_TAG}..."
            git remote set-url origin https://${GHCR_USER}:${GHCR_TOKEN}@github.com/${GHCR_USER}/pandypost_api.git
            git fetch --force --tags origin
            git checkout --force "${IMAGE_TAG}"
            # Não deixa o token gravado no .git/config do servidor.
            git remote set-url origin https://github.com/${GHCR_USER}/pandypost_api.git

            echo "Setting up SSL certificate..."
            export CF_API_TOKEN="${CF_API_TOKEN}"
            export CF_HOSTNAMES="${CF_HOSTNAMES}"
            ./docker/scripts/setup-origin-cert.sh

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${GHCR_USER} --password-stdin

            export IMAGE_TAG=${IMAGE_TAG}
            export IMAGE_PREFIX=${IMAGE_PREFIX}

            echo "Pulling images with tag: \${IMAGE_TAG}"
            \${COMPOSE} pull

            # Subida em etapas para migrar com o código novo antes de os
            # workers começarem a consumir a fila. --wait usa os healthchecks
            # do compose, o que substitui o antigo 'sleep 5' + laço de retry.
            echo "Starting datastores..."
            \${COMPOSE} up -d --wait redis redis-cache

            echo "Starting PHP-FPM..."
            \${COMPOSE} up -d --no-deps --wait php

            echo "Running migrations..."
            \${COMPOSE} exec -T php php artisan migrate --force

            # config/route/event cache é feito pelo entrypoint de cada
            # container, então não há mais 'artisan optimize' aqui.
            # Horizon também não precisa de 'horizon:terminate': o container
            # é recriado pelo up e o stop_grace_period drena os jobs.
            echo "Starting nginx, horizon and scheduler..."
            \${COMPOSE} up -d --wait --remove-orphans

            echo "Cleaning old images..."
            docker image prune -f
            docker logout ghcr.io

            \${COMPOSE} ps
          DEPLOY_SCRIPT

      - name: Test site connectivity
        run: |
          sleep 10
          # Encadeado com || o passo nunca falhava, porque o echo final sempre
          # retorna 0. Agora um site fora do ar quebra o workflow.
          for i in 1 2 3 4 5 6; do
            if curl -fsS -k -m 10 "https://${{ secrets.DOMAIN_NAME }}/up" -o /dev/null; then
              echo "HTTPS OK"
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando..."
            sleep 10
          done
          echo "::error::Site não respondeu em https://${{ secrets.DOMAIN_NAME }}/up"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa ~/.ssh/id_ed25519
