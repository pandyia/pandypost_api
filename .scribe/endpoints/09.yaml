name: Analytics
description: |-

  Métricas das contas conectadas, no **mesmo formato** para YouTube, Instagram e TikTok.
  Métrica que a plataforma não oferece simplesmente não aparece.

  **Permissão:** nenhuma além de ser membro do workspace (VULN-06 em `specs/002`, em aberto).
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/analytics/{socialAccount_uuid}/dashboard'
    metadata:
      custom: []
      groupName: Analytics
      groupDescription: |-

        Métricas das contas conectadas, no **mesmo formato** para YouTube, Instagram e TikTok.
        Métrica que a plataforma não oferece simplesmente não aparece.

        **Permissão:** nenhuma além de ser membro do workspace (VULN-06 em `specs/002`, em aberto).
      subgroup: ''
      subgroupDescription: ''
      title: 'Dashboard da conta'
      description: |-
        Monte a interface a partir da resposta:

        - **Filtros de período:** `capabilities.date_ranges` (o que a plataforma aceita) e `capabilities.max_range_days`.
        - **Cards:** `overview`. `previous` e `trend` (variação %) podem ser `null` quando não há base de comparação.
        - **Gráfico:** `time_series.dates` + `series[].current` / `series[].previous`.
        - **Formato dos números:** campo `format` = `number` | `percent` | `duration` (segundos) | `hours` | `currency`.
        - **Avisos:** `alerts` (`type`: `success`, `warning`, `danger`, `info`) e `notes` (textos fixos da plataforma).

        Períodos por plataforma: YouTube `last_7_days`, `last_28_days`, `last_90_days`, `this_month`, `last_month`,
        `last_365_days`, `lifetime`, `custom`; Instagram `last_7_days`, `last_28_days`, `custom` (máx. 30 dias);
        TikTok `last_7_days`, `last_28_days`, `last_90_days`, `custom` (máx. 365 dias).

        Resultado em cache (YouTube 6h, Instagram 3h, TikTok 1h).
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      socialAccount_uuid:
        custom: []
        name: socialAccount_uuid
        description: 'UUID da conta social.'
        required: true
        example: 5f0c2d1e-7a8b-4c9d-8e0f-1a2b3c4d5e6f
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      socialAccount_uuid: 5f0c2d1e-7a8b-4c9d-8e0f-1a2b3c4d5e6f
    queryParameters:
      date_range:
        custom: []
        name: date_range
        description: 'Período. Padrão `last_28_days`.'
        required: false
        example: last_28_days
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      start_date:
        custom: []
        name: start_date
        description: 'Obrigatório com `date_range=custom` (`Y-m-d`).'
        required: false
        example: '2026-09-01'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      end_date:
        custom: []
        name: end_date
        description: 'Obrigatório com `date_range=custom` (`Y-m-d`), até hoje.'
        required: false
        example: '2026-09-28'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      refresh:
        custom: []
        name: refresh
        description: '`1` ignora o cache. No máximo 1 vez a cada 10 minutos por conta.'
        required: false
        example: false
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
      date_range: last_28_days
      start_date: '2026-09-01'
      end_date: '2026-09-28'
      refresh: false
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "data": {
              "platform": "instagram",
              "period": {"start": "2026-09-16", "end": "2026-10-13", "previous_start": "2026-08-19", "previous_end": "2026-09-15", "granularity": "day", "date_range": "last_28_days"},
              "capabilities": {"date_ranges": ["last_7_days", "last_28_days", "custom"], "max_range_days": 30, "has_daily_series": true, "has_revenue": false, "has_watch_time": false},
              "overview": [
                {"key": "views", "label": "Visualizações", "format": "number", "value": 12034, "previous": 9800, "trend": 22.8, "description": "Total de visualizações no período."}
              ],
              "time_series": {
                "dates": ["2026-09-16", "2026-09-17"],
                "series": [{"key": "reach", "label": "Alcance", "format": "number", "type": "area", "current": [120, 98], "previous": [80, 101]}]
              },
              "breakdowns": [{"key": "content_type", "label": "Visualizações por formato", "items": [{"key": "REEL", "label": "Reels", "value": 900}]}],
              "top_content": {
                "columns": [{"key": "views", "label": "Visualizações", "format": "number"}],
                "items": [{"id": "1789...", "title": "Bastidores", "thumbnail_url": "https://...", "permalink": "https://www.instagram.com/p/...", "published_at": "2026-09-20T18:00:00Z", "format": "reel", "metrics": {"views": 1000, "engagement_rate": 4.2}}]
              },
              "score": {"value": 72, "engagement": 40, "growth": 20, "frequency": 12},
              "alerts": [{"type": "success", "title": "Visualizações em alta", "message": "Suas visualizações subiram 22,8% em relação ao período anterior."}],
              "notes": ["Os dados do Instagram podem ter atraso de até 48 horas."],
              "generated_at": "2026-10-14T18:00:00Z"
            }
          }
        headers: []
        description: ''
      -
        custom: []
        status: 409
        content: '{"error": "analytics_reauth_required", "message": "Reconecte a conta do Instagram para liberar a leitura das métricas."}'
        headers: []
        description: 'reconectar conta'
      -
        custom: []
        status: 422
        content: |-
          {"message": "Período não disponível para esta plataforma.", "errors": {"date_range": ["Período não disponível para esta plataforma."]}}

          No 409, mostre o botão "Reconectar conta" (fluxo de [Contas sociais](#contas-sociais)).
        headers: []
        description: 'período inválido'
      -
        custom: []
        status: 429
        content: '{"error": "analytics_refresh_too_soon", "message": "Você já atualizou os dados recentemente. Tente novamente em 7 minutos."}'
        headers: []
        description: 'refresh repetido'
      -
        custom: []
        status: 502
        content: '{"error": "analytics_provider_unavailable", "message": "Não foi possível carregar as métricas do Instagram agora. Tente novamente em alguns minutos."}'
        headers: []
        description: 'plataforma fora do ar'
    responseFields:
      score:
        custom: []
        name: score
        description: 'Nota da conta (0–100) = `engagement` (até 50) + `growth` (até 30) + `frequency` (até 20).'
        required: false
        example: null
        type: object
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/analytics/{socialAccount_uuid}/best-times'
    metadata:
      custom: []
      groupName: Analytics
      groupDescription: |-

        Métricas das contas conectadas, no **mesmo formato** para YouTube, Instagram e TikTok.
        Métrica que a plataforma não oferece simplesmente não aparece.

        **Permissão:** nenhuma além de ser membro do workspace (VULN-06 em `specs/002`, em aberto).
      subgroup: ''
      subgroupDescription: ''
      title: 'Melhores horários para postar'
      description: |-
        Média de visualizações por hora de publicação dos últimos conteúdos (até 50), no fuso `America/Sao_Paulo`.
        Com menos de 5 conteúdos, `best_hours` é uma sugestão padrão e `is_fallback` vem `true`.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      socialAccount_uuid:
        custom: []
        name: socialAccount_uuid
        description: 'UUID da conta social.'
        required: true
        example: 5f0c2d1e-7a8b-4c9d-8e0f-1a2b3c4d5e6f
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      socialAccount_uuid: 5f0c2d1e-7a8b-4c9d-8e0f-1a2b3c4d5e6f
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "data": {
              "best_hours": [18, 20, 12],
              "by_hour": [{"hour": 0, "average": 0, "posts": 0}, {"hour": 18, "average": 1520.5, "posts": 6}],
              "metric": "views",
              "sample_size": 37,
              "is_fallback": false,
              "timezone": "America/Sao_Paulo"
            }
          }
        headers: []
        description: ''
    responseFields:
      by_hour:
        custom: []
        name: by_hour
        description: 'Sempre 24 posições (horas 0 a 23).'
        required: false
        example: null
        type: 'object[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
