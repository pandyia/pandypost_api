        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      timezone:
        custom: []
        name: timezone
        description: 'Fuso horário IANA.'
        required: true
        example: America/Sao_Paulo
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      name: 'Maria Souza'
      phone: '11912345678'
      bio: 'Crio conteúdo sobre receitas.'
      timezone: America/Sao_Paulo
    fileParameters: []
    responses:
