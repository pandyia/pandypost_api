        content: '{"data": {"id": 12, "name": "Maria Souza", "email": "maria@exemplo.com", "avatar": null, "phone": "11912345678", "bio": "Crio conteúdo sobre receitas.", "timezone": "America/Sao_Paulo", "created_at": "2026-03-02T14:20:00-03:00", "email_verified_at": "2026-03-02T14:25:10-03:00", "is_active": true, "is_super_admin": false, "permissions": []}}'
