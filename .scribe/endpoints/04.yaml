        → o Stripe volta para o frontend → consulte `GET /billing/subscription`.
      subgroup: ''
      subgroupDescription: ''
      title: 'Assinatura atual'
      description: '**Permissão:** `billing.view`'
      authenticated: true
      deprecated: false
