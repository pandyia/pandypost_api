server_tokens off;

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# DNS interno do Docker. Os backends são endereçados por variável no
# proxy_pass (ver @octane e /app/), o que obriga o nginx a resolver o nome a
# cada request, com cache de 10s. Com `upstream { server php:8000; }` o nome
# era resolvido UMA vez no boot do nginx: quando o deploy recriava o container
# php com outro IP, o nginx seguia mandando tráfego para o IP antigo (502
# "Connection refused") até ser reiniciado.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Origens que recebem CORS nas respostas de erro geradas pelo PRÓPRIO nginx
# (502/504 com o Octane fora do ar). As respostas normais têm CORS do Laravel
# (config/cors.php) — manter as duas listas em sincronia.
map $http_origin $cors_error_origin {
    default             "";
    "https://pandy.pro" $http_origin;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    root /var/www/html/public;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 12M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 65s;
    keepalive_requests 1000;

    client_body_temp_path /tmp/nginx_upload 1 2;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS das páginas de erro do nginx. As variáveis só ganham valor em
    # @octane_502/@octane_504; em qualquer outra resposta ficam vazias e o
    # nginx não emite o header — o CORS vem só do Laravel, sem duplicar
    # (header duplicado também quebra o CORS). Ficam aqui, e não nas
    # locations de erro, porque um add_header dentro da location descartaria
    # todos os headers de segurança acima.
    set $err_cors_origin "";
    set $err_cors_credentials "";
    set $err_cors_methods "";
    set $err_cors_headers "";
    set $err_cors_vary "";
    add_header Access-Control-Allow-Origin $err_cors_origin always;
    add_header Access-Control-Allow-Credentials $err_cors_credentials always;
    add_header Access-Control-Allow-Methods $err_cors_methods always;
    add_header Access-Control-Allow-Headers $err_cors_headers always;
    add_header Vary $err_cors_vary always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/rss+xml
        text/css
        text/plain
        text/xml
        text/javascript
        image/svg+xml;

    open_file_cache max=2000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Arquivo estático de public/ (assado na imagem) sai direto do nginx;
    # o resto vai para o Octane.
    location / {
        try_files $uri @octane;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    # public/ está no disco do nginx só para servir estático: sem isto o
    # try_files acima entregaria o fonte de /index.php como texto.
    location ~ \.php$ {
        return 404;
    }

    # Echo/Pusher conecta em /app/{key}. A API HTTP do Reverb (/apps/...,
    # usada para publicar eventos) NÃO é exposta: o Laravel publica direto em
    # reverb:8080 pela rede do compose.
    location ^~ /app/ {
        # Variável = nome re-resolvido a cada request (ver `resolver`). Sem URI
        # no valor, o caminho original segue intacto, como antes.
        set $reverb_backend http://reverb:8080;
        proxy_pass $reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Acima do ping_interval do Reverb (60s): com o default de 60s o nginx
        # derrubaria conexões ociosas bem no limite do ping.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location @octane {
        # Variável = nome re-resolvido a cada request (ver `resolver`). Sem URI
        # no valor, o nginx repassa a URI original, como o antigo
        # `proxy_pass http://octane;`. O preço é perder o pool keepalive do
        # bloco upstream: uma conexão TCP por request na rede interna.
        set $octane_backend http://php:8000;
        proxy_pass $octane_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr já é o IP real do cliente (real_ip_header acima). Não
        # usamos $proxy_add_x_forwarded_for para não repassar um
        # X-Forwarded-For forjado pelo cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Buffering LIGADO nos dois sentidos: o nginx absorve cliente lento e
        # entrega a request inteira ao Octane, que tem poucos workers e não
        # pode ficar preso esperando rede.
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        # Acima do max_execution_time do Octane (30s, config/octane.php).
        proxy_read_timeout 60s;

        # Só erros gerados pelo nginx (Octane inacessível ou sem resposta):
        # sem proxy_intercept_errors, um 5xx do próprio Laravel passa direto,
        # já com o CORS dele.
        error_page 502 = @octane_502;
        error_page 504 = @octane_504;
    }

    # Sem CORS aqui o browser mostra "CORS Missing Allow Origin" e esconde o
    # 502 real. O preflight também é respondido: se ele falhar, o browser nem
    # chega a mandar a request e o front volta a ver só erro de CORS. Os
    # valores espelham config/cors.php (métodos e headers ecoados, com
    # credenciais) e não mandam Max-Age, para não cachear preflight de erro.
    location @octane_502 {
        set $err_cors_origin $cors_error_origin;
        set $err_cors_credentials "true";
        set $err_cors_methods $http_access_control_request_method;
        set $err_cors_headers $http_access_control_request_headers;
        set $err_cors_vary "Origin";
        default_type application/json;
        if ($request_method = OPTIONS) {
            return 204;
        }
        return 502 '{"message":"Serviço temporariamente indisponível."}';
    }

    location @octane_504 {
        set $err_cors_origin $cors_error_origin;
        set $err_cors_credentials "true";
        set $err_cors_methods $http_access_control_request_method;
        set $err_cors_headers $http_access_control_request_headers;
        set $err_cors_vary "Origin";
        default_type application/json;
        if ($request_method = OPTIONS) {
            return 204;
        }
        return 504 '{"message":"O servidor demorou demais para responder."}';
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|bak|conf|dist|fla|inc|psd|swp)$ {
        deny all;
    }

    access_log /var/log/nginx/access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/error.log warn;
}
