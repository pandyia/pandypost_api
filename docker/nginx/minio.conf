# Proxy de dev para o MinIO.
#
# A presigned URL assina o header Host, então o PHP (que assina como
# "minio:9000") e o browser precisam falar com o mesmo host — e o browser não
# resolve nomes da rede do Docker. Este server escuta em localhost:9002, para
# onde o AWS_TEMPORARY_URL reescreve as presigned URLs, e restaura o Host
# original antes de repassar ao MinIO. Sem isso: SignatureDoesNotMatch (403).
server {
    listen 9002;
    listen [::]:9002;
    server_name _;

    # Upload de vídeo vai direto do browser pra cá via presigned PUT: sem limite
    # de corpo e sem buffer em disco, senão um arquivo grande estoura o /tmp.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    # Uploads longos não podem morrer no timeout padrão de 60s.
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location / {
        # Resolver do Docker + upstream em variável: o nginx sobe mesmo que o
        # MinIO ainda não esteja de pé, em vez de falhar no boot.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $minio http://minio:9000;

        # O Host tem que ser exatamente o que o PHP assinou.
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass $minio$request_uri;
    }

    # O CORS quem responde é o MinIO (MINIO_API_CORS_ALLOW_ORIGIN).
    add_header X-Frame-Options "";

    error_log  /var/log/nginx/minio-error.log;
    access_log /var/log/nginx/minio-access.log;
}
