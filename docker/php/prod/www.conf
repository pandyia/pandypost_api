[www]
user = laravel
group = laravel

listen = 9000
listen.backlog = 511

; php_admin_value sobrescreve o memory_limit do php.ini (384M, voltado ao CLI
; do Horizon) só para este pool. Sem isso o teto do container web seria
; 8 x 384M.
php_admin_value[memory_limit] = 128M

; static mantém os workers quentes (sem custo de fork no pico) e dá um teto
; de RAM previsível: 8 x 128M = 1024M, mais ~320M de opcache/JIT/interned
; strings, dentro do limite de 1536M do container.
pm = static
pm.max_children = 8
pm.max_requests = 1000

pm.status_path = /fpm-status
ping.path = /fpm-ping

request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /var/log/php/fpm-slow.log

clear_env = no

catch_workers_output = yes
decorate_workers_output = no
