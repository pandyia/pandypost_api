[PHP]
; Tudo roda em CLI (Octane, Reverb, Horizon, scheduler), então este é o limite
; de todos. Precisa ficar ACIMA do maior `memory` de config/horizon.php (256M
; em youtube/tiktok), senão o worker sofre fatal antes de o Horizon reciclar o
; processo. Não adianta passar -d memory_limit no comando do container: o
; Horizon forka `php artisan horizon:work` e o Octane sobe o servidor Swoole
; num processo PHP novo, nenhum dos dois herda a flag.
; No Octane é só um teto de segurança por worker: o consumo normal é contido
; por --max-requests e pelo `garbage` de config/octane.php.
memory_limit = 384M
; O CLI ignora max_execution_time; o timeout de request do Octane vem de
; `max_execution_time` em config/octane.php.
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 10M
post_max_size = 10M
file_uploads = On
allow_url_fopen = On

display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/log/php/php_errors.log

expose_php = Off

default_charset = "UTF-8"
date.timezone = UTC

; Laravel resolve muito caminho a cada request; o default de 256K estoura
; com o tamanho do vendor e vira syscall de stat em todo autoload.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable=1
opcache.enable_cli=1

; O vendor --no-dev tem 42.5k arquivos, mas 32.7k são de
; google/apiclient-services (todas as APIs do Google, sendo que só o YouTube
; é usado) e nunca são carregados. O working set real fica na casa dos
; milhares, então 24000 dá folga larga sobre os 10000 anteriores — que ficavam
; abaixo do necessário e faziam o excedente ser recompilado a cada request.
; O PHP arredonda para o próximo primo da tabela interna (32531).
opcache.max_accelerated_files=24000
; Medido no container: só o bootstrap do framework já ocupa ~39MB de opcache
; e 14.3MB dos 16MB de interned strings. Com todos os controllers e jobs
; quentes o buffer de strings estouraria, e strings não internadas passam a
; ser copiadas por processo — o custo aparece na RAM de cada worker do FPM.
opcache.memory_consumption=256
opcache.interned_strings_buffer=32

; As imagens são imutáveis (tag por release), então nunca revalidar mtime.
opcache.validate_timestamps=0
opcache.save_comments=1

; JIT desligado: o ganho é desprezível numa API presa a I/O (banco, Redis,
; S3, APIs das redes), e JIT + Swoole tem histórico de segfault. Também
; devolve os 32M de buffer em cada container.
opcache.jit=disable
opcache.jit_buffer_size=0

[swoole]
; Desliga os aliases curtos globais do Swoole (go(), defer(), chan) para não
; colidirem com funções de pacotes; o Octane não usa.
swoole.use_shortname = Off
