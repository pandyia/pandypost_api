; Este container roda SOMENTE o Octane (Swoole) — o HTTP da API.
; Reverb, Horizon e scheduler são serviços próprios em docker-compose.prod.yml,
; com limites de CPU/RAM independentes — assim um pico de fila ou de conexões
; WebSocket não derruba a API.
; O logrotate vive aqui porque storage/logs é volume compartilhado entre os
; containers, então rotacionar num só cobre todos.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --workers e --task-workers fixos (e não auto): auto usa o nº de CPUs do
; HOST, não o limite de CPU do container — cada task worker é mais uma cópia
; da app em memória. O app não usa Octane::concurrently nem tick (desligado em
; config/octane.php), então 1 task worker basta; 0 não funciona: o Swoole
; ignora e sobe um por CPU. --max-requests recicla o worker e contém vazamento de
; memória entre requests. Sem --watch: a imagem é imutável.
; TERM faz o Octane drenar as requests em andamento antes de sair; o
; stopwaitsecs fica abaixo do stop_grace_period do compose.
[program:octane]
command=php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --workers=%(ENV_OCTANE_WORKERS)s --task-workers=1 --max-requests=%(ENV_OCTANE_MAX_REQUESTS)s
directory=/var/www/html
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true

[program:logrotate]
command=/bin/sh -c "while true; do /usr/sbin/logrotate /etc/logrotate.d/laravel --state /tmp/logrotate.state; sleep 3600; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
