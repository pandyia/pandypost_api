; Este container roda SOMENTE o PHP-FPM.
; Horizon e scheduler são serviços próprios em docker-compose.prod.yml, com
; limites de CPU/RAM independentes — assim um pico de fila não derruba o site.
; O logrotate vive aqui porque storage/logs é volume compartilhado entre os
; três containers, então rotacionar num só cobre todos.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
command=php-fpm --nodaemonize
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT

[program:logrotate]
command=/bin/sh -c "while true; do /usr/sbin/logrotate /etc/logrotate.d/laravel --state /tmp/logrotate.state; sleep 3600; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
