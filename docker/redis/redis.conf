# Instância dedicada a filas, jobs e metadados do Horizon.
# O cache/sessão roda em outra instância (redis-cache), com política oposta.

# 384mb de dados + overhead de fragmentação/replicação cabe no limite de 512M
# do container definido em docker-compose.prod.yml.
maxmemory 384mb

# noeviction: um job nunca pode ser descartado silenciosamente. Se encher,
# o Redis passa a recusar escritas (o enqueue falha alto) em vez de perder
# posts agendados. volatile-lru era perigoso aqui porque as chaves do
# Horizon (recent/completed/failed) têm TTL e seriam as primeiras a sumir.
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10

tcp-keepalive 60
tcp-backlog 128
timeout 0

hz 10

activedefrag yes
active-defrag-threshold-lower 10
active-defrag-cycle-min 1
active-defrag-cycle-max 25

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

databases 4
