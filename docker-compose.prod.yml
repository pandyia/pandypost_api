# Topologia interna: o Laravel (Octane, Horizon, scheduler) publica eventos
# direto no Reverb pela rede do compose, sem sair por nginx/Cloudflare. Fica
# aqui e não no .env do servidor porque é fato da stack, não configuração —
# o .env continua com o host público (REVERB_HOST) para o frontend.
x-reverb-internal: &reverb-internal
    REVERB_SERVER_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http

services:
    nginx:
        image: ${IMAGE_PREFIX:-ghcr.io/pandyia}/pandypost-nginx:${IMAGE_TAG:-latest}
        container_name: pandypost-nginx-prod
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ~/ssl:/etc/nginx/ssl:ro
        depends_on:
            php:
                condition: service_healthy
            reverb:
                condition: service_healthy
        networks:
            - pandypost-network-prod
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/up || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 256M
                reservations:
                    memory: 64M

    php:
        image: ${IMAGE_PREFIX:-ghcr.io/pandyia}/pandypost-php:${IMAGE_TAG:-latest}
        container_name: pandypost-php-prod
        restart: always
        env_file:
            - .env
        environment:
            <<: *reverb-internal
            # Octane não usa coroutines: concorrência = nº de workers. Cada
            # worker mantém a app carregada (~80-120M em regime).
            OCTANE_WORKERS: ${OCTANE_WORKERS:-4}
            OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-1000}
        # Sem `ports`: só o nginx alcança o Octane (TrustProxies confia em
        # qualquer origem justamente por isso).
        stop_signal: SIGTERM
        stop_grace_period: 30s
        volumes:
            - app_storage:/var/www/html/storage
            - ./storage/logs:/var/www/html/storage/logs
        depends_on:
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_healthy
        networks:
            - pandypost-network-prod
        healthcheck:
            # /up passa pelo boot do Laravel num worker de verdade, não só
            # pela porta aberta.
            test: ["CMD-SHELL", "curl -fsS -o /dev/null -m 4 http://127.0.0.1:8000/up || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 40s
        deploy:
            resources:
                limits:
                    # Em regime cada worker fica em ~80-120M; o memory_limit
                    # de 384M é só o teto de um worker descontrolado. Ao subir
                    # OCTANE_WORKERS, suba este limite junto.
                    cpus: "1.00"
                    memory: 1536M
                reservations:
                    memory: 384M

    reverb:
        image: ${IMAGE_PREFIX:-ghcr.io/pandyia}/pandypost-php:${IMAGE_TAG:-latest}
        container_name: pandypost-reverb-prod
        restart: always
        env_file:
            - .env
        environment:
            <<: *reverb-internal
        command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
        # Sem `ports`: o cliente entra por wss://<api>/app/ via nginx (TLS,
        # Cloudflare). A API HTTP do Reverb fica só na rede interna.
        # Cada conexão WebSocket é um descritor de arquivo.
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        stop_signal: SIGTERM
        stop_grace_period: 30s
        volumes:
            - app_storage:/var/www/html/storage
            - ./storage/logs:/var/www/html/storage/logs
        depends_on:
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_healthy
        networks:
            - pandypost-network-prod
        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 512M
                reservations:
                    memory: 128M

    horizon:
        image: ${IMAGE_PREFIX:-ghcr.io/pandyia}/pandypost-php:${IMAGE_TAG:-latest}
        container_name: pandypost-horizon-prod
        restart: always
        env_file:
            - .env
        environment:
            <<: *reverb-internal
        command: ["php", "artisan", "horizon"]
        stop_signal: SIGTERM
        stop_grace_period: 60s
        volumes:
            - app_storage:/var/www/html/storage
            - ./storage/logs:/var/www/html/storage/logs
        depends_on:
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_healthy
        networks:
            - pandypost-network-prod
        healthcheck:
            test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                limits:
                    # Teto dos workers (1792M, ver config/horizon.php) + a
                    # memória compartilhada de opcache/interned strings
                    # (~290M), que também é cobrada do cgroup do container.
                    cpus: "1.00"
                    memory: 2304M
                reservations:
                    memory: 512M

    scheduler:
        image: ${IMAGE_PREFIX:-ghcr.io/pandyia}/pandypost-php:${IMAGE_TAG:-latest}
        container_name: pandypost-scheduler-prod
        restart: always
        env_file:
            - .env
        environment:
            <<: *reverb-internal
        command: ["php", "artisan", "schedule:work"]
        stop_signal: SIGTERM
        stop_grace_period: 30s
        volumes:
            - app_storage:/var/www/html/storage
            - ./storage/logs:/var/www/html/storage/logs
        depends_on:
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_healthy
        networks:
            - pandypost-network-prod
        deploy:
            resources:
                limits:
                    # schedule:work forka um `php artisan` por comando devido,
                    # com o memory_limit do CLI (384M), em cima do opcache
                    # compartilhado.
                    cpus: "0.25"
                    memory: 768M
                reservations:
                    memory: 128M

    # Instância de filas / Horizon: nunca despeja chaves, persiste em AOF.
    redis:
        image: ${IMAGE_PREFIX:-ghcr.io/pandyia}/pandypost-redis:${IMAGE_TAG:-latest}
        container_name: pandypost-redis-prod
        restart: always
        # requirepass entra por argumento em vez de ir no redis.conf, que é
        # assado na imagem — senha não pode viver dentro do registry. Args
        # depois do arquivo de config sobrescrevem as diretivas dele.
        # O :? aborta o deploy se REDIS_PASSWORD não estiver no .env, para
        # nunca subir um Redis aberto por engano.
        command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
            - --requirepass
            - ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env do servidor}
        environment:
            # redis-cli lê esta var sozinho, então a senha não aparece na
            # linha de comando do healthcheck.
            REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env do servidor}
        volumes:
            - redis_data_prod:/data
        networks:
            - pandypost-network-prod
        healthcheck:
            # `redis-cli ping` sai com código 0 mesmo respondendo NOAUTH, então
            # sem o grep o healthcheck ficaria verde com o Redis inacessível.
            test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.35"
                    memory: 512M
                reservations:
                    memory: 128M

    # Instância de cache / sessão: descartável, LRU global, sem persistência.
    redis-cache:
        image: ${IMAGE_PREFIX:-ghcr.io/pandyia}/pandypost-redis:${IMAGE_TAG:-latest}
        container_name: pandypost-redis-cache-prod
        restart: always
        command:
            - redis-server
            - --maxmemory
            - 384mb
            - --maxmemory-policy
            - allkeys-lru
            - --maxmemory-samples
            - "7"
            - --save
            - ""
            - --appendonly
            - "no"
            - --lazyfree-lazy-eviction
            - "yes"
            - --lazyfree-lazy-expire
            - "yes"
            - --lazyfree-lazy-server-del
            - "yes"
            - --databases
            - "2"
            - --tcp-keepalive
            - "60"
            - --hz
            - "10"
            - --requirepass
            - ${REDIS_CACHE_PASSWORD:-${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env do servidor}}
        environment:
            REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD:-${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env do servidor}}
        networks:
            - pandypost-network-prod
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 512M
                reservations:
                    memory: 64M

volumes:
    redis_data_prod:
    app_storage:

networks:
    pandypost-network-prod:
        driver: bridge
